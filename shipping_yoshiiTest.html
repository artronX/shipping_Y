<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉井電気 製品出荷管理 (WebVer. 1)</title>
    
    <!-- React 18 -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ExcelJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    
    <!-- Firebase V9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase 初期化設定
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForSecurityConfigOnly",
            authDomain: "yoshii-shipping.firebaseapp.com",
            projectId: "yoshii-shipping",
            storageBucket: "yoshii-shipping.appspot.com",
            messagingSenderId: "000000000000",
            appId: "1:000000000000:web:000000000000"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // SHA-256 ハッシュ生成関数
        async function hashPassword(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 正しいSHA-256ハッシュ対比表
        const AUTH_PERMISSIONS = {
            // Zall@0617 (管理者)
            '5579cdc6320d1718cd7c5f40c65230f504ef19055c16e919a0183298ddc32805': {
                role: 'admin', name: '管理者', vendor: 'ALL',
                screens: ['schedule', 'drayage', 'plan', 'allocation', 'other'],
                canEdit: true, canDelete: true, canImport: true
            },
            // Read＠0617 (閲覧専用 - 東亜)
            '1df4ee4fe023087aba3d91e6e7a589ef60c6e4fdd0beb653e5bdd30a7cc5d83d': {
                role: 'read', name: '閲覧専用', vendor: 'ALL',
                screens: ['schedule'],
                canEdit: false, canDelete: false, canImport: false
            },
            // JPZ10345 (JP管理者)
            '16bdf5696aa28e37f4feba4e6addbbccefeb0d277adaad62341942c74522586d': {
                role: 'vendor_jp', name: 'JP管理者', vendor: 'JP',
                screens: ['schedule'],
                canEdit: true, canDelete: false, canImport: false
            },
            // GM10345Z (GM管理者)
            '09601fab9012fdf12499952140117516683995014bec9dd15cafe0cdb6cb4005': {
                role: 'vendor_gm', name: 'GM管理者', vendor: 'GM',
                screens: ['schedule'],
                canEdit: true, canDelete: false, canImport: false
            },
            // LDSZ1034 (LDS管理者)
            'b7b32aa228848392ed901100150a59ba680f4e10a81c564a617e15f8a18953f7': {
                role: 'vendor_lds', name: 'LDS管理者', vendor: 'LDS',
                screens: ['schedule'],
                canEdit: true, canDelete: false, canImport: false
            },
            // SLT1034Z (SLT管理者)
            '5af306260c101af52e30743755566709b0ebd3e0368321c8058b592e5530c996': {
                role: 'vendor_slt', name: 'SLT管理者', vendor: 'SLT',
                screens: ['schedule'],
                canEdit: true, canDelete: false, canImport: false
            },
            // YosiiZ (ドレージ)
            'd61ec598b505d37324b46365777d9e7f917b0fc37ec065c3659af84a4e584741': {
                role: 'drayage_user', name: 'Yosii(ドレージ)', vendor: 'ALL',
                screens: ['drayage'],
                canEdit: true, canDelete: false, canImport: false
            }
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUserPerm, setCurrentUserPerm] = useState(null);
            const [workerName, setWorkerName] = useState('');
            const [inputPass, setInputPass] = useState('');
            const [inputWorker, setInputWorker] = useState('');
            const [loginError, setLoginError] = useState('');
            const [activeTab, setActiveTab] = useState('schedule');
            const [schedules, setSchedules] = useState([]);
            const [loading, setLoading] = useState(true);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');

                if (!inputWorker.trim()) {
                    setLoginError('担当者名（姓名/簡体字/英字）を入力してください。');
                    return;
                }

                const hashed = await hashPassword(inputPass.trim());
                const perm = AUTH_PERMISSIONS[hashed];

                if (perm) {
                    setCurrentUserPerm(perm);
                    setWorkerName(inputWorker.trim());
                    setIsAuthenticated(true);
                    setActiveTab(perm.screens[0]);
                } else {
                    setLoginError('パスワードが正しくありません。');
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setCurrentUserPerm(null);
                setWorkerName('');
                setInputPass('');
                setInputWorker('');
            };

            useEffect(() => {
                if (!isAuthenticated) return;
                const unsubscribe = db.collection('shipping_schedules').onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSchedules(data);
                    setLoading(false);
                }, err => {
                    console.error("Firestore Error:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [isAuthenticated]);

            const filteredSchedules = useMemo(() => {
                if (!currentUserPerm) return [];
                if (currentUserPerm.vendor === 'ALL') return schedules;
                return schedules.filter(item => item.vendorCode === currentUserPerm.vendor);
            }, [schedules, currentUserPerm]);

            if (!isAuthenticated) {
                return (
                    <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
                            <div class="text-center mb-6">
                                <h1 class="text-2xl font-bold text-gray-800">吉井電気 製品出荷管理</h1>
                                <p class="text-xs text-blue-600 font-semibold mt-1">WebVer. 1 - アクセス認証</p>
                            </div>
                            
                            <form onSubmit={handleLogin} class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">
                                        担当者名 / 姓名 <span class="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        placeholder="例: 張偉 / John Smith / 近間"
                                        value={inputWorker}
                                        onChange={(e) => setInputWorker(e.target.value)}
                                        class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        required
                                    />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">
                                        パスワード <span class="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="password"
                                        placeholder="パスワードを入力"
                                        value={inputPass}
                                        onChange={(e) => setInputPass(e.target.value)}
                                        class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        required
                                    />
                                </div>

                                {loginError && (
                                    <div class="p-2 bg-red-100 border border-red-400 text-red-700 text-sm rounded">
                                        {loginError}
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200"
                                >
                                    ログイン（画面ロック解除）
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div class="flex flex-col h-screen">
                    <header class="bg-gray-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
                        <div class="flex items-center space-x-3">
                            <h1 class="text-xl font-bold">吉井電気 製品出荷管理</h1>
                            <span class="bg-blue-600 text-xs px-2 py-1 rounded-full font-mono font-semibold">WebVer. 1</span>
                        </div>
                        <div class="flex items-center space-x-4 text-sm">
                            <div class="bg-gray-700 px-3 py-1 rounded text-gray-200">
                                権限: <span class="font-bold text-yellow-400">{currentUserPerm.name}</span>
                            </div>
                            <div class="bg-gray-700 px-3 py-1 rounded text-gray-200">
                                作業者: <span class="font-bold text-green-400">{workerName}</span>
                            </div>
                            <button onClick={handleLogout} class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded">
                                ログアウト
                            </button>
                        </div>
                    </header>

                    <div class="bg-white border-b border-gray-200 px-6 pt-2 flex space-x-2">
                        {currentUserPerm.screens.includes('schedule') && (
                            <button onClick={() => setActiveTab('schedule')} class={`px-4 py-2 text-sm font-semibold border-b-2 ${activeTab === 'schedule' ? 'border-blue-600 text-blue-600' : 'text-gray-500'}`}>出荷日程表</button>
                        )}
                        {currentUserPerm.screens.includes('drayage') && (
                            <button onClick={() => setActiveTab('drayage')} class={`px-4 py-2 text-sm font-semibold border-b-2 ${activeTab === 'drayage' ? 'border-blue-600 text-blue-600' : 'text-gray-500'}`}>ドレージ管理</button>
                        )}
                        {currentUserPerm.screens.includes('plan') && (
                            <button onClick={() => setActiveTab('plan')} class={`px-4 py-2 text-sm font-semibold border-b-2 ${activeTab === 'plan' ? 'border-blue-600 text-blue-600' : 'text-gray-500'}`}>出荷計画表</button>
                        )}
                        {currentUserPerm.screens.includes('allocation') && (
                            <button onClick={() => setActiveTab('allocation')} class={`px-4 py-2 text-sm font-semibold border-b-2 ${activeTab === 'allocation' ? 'border-blue-600 text-blue-600' : 'text-gray-500'}`}>コンテナ割振り</button>
                        )}
                        {currentUserPerm.screens.includes('other') && (
                            <button onClick={() => setActiveTab('other')} class={`px-4 py-2 text-sm font-semibold border-b-2 ${activeTab === 'other' ? 'border-blue-600 text-blue-600' : 'text-gray-500'}`}>その他管理</button>
                        )}
                    </div>

                    <main class="flex-1 p-6 overflow-auto custom-scrollbar bg-gray-50">
                        {loading ? <div>データを読み込み中...</div> : (
                            <div>
                                {activeTab === 'schedule' && <ScheduleView schedules={filteredSchedules} perm={currentUserPerm} workerName={workerName} />}
                                {activeTab === 'drayage' && <DrayageView schedules={filteredSchedules} perm={currentUserPerm} workerName={workerName} />}
                                {activeTab === 'plan' && <PlanView schedules={filteredSchedules} perm={currentUserPerm} workerName={workerName} />}
                                {activeTab === 'allocation' && <AllocationView schedules={filteredSchedules} perm={currentUserPerm} workerName={workerName} />}
                                {activeTab === 'other' && <OtherView schedules={filteredSchedules} perm={currentUserPerm} workerName={workerName} />}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function ScheduleView({ schedules, perm, workerName }) {
            return (
                <div class="bg-white rounded-lg shadow p-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">出荷日程表 {perm.vendor !== 'ALL' && `[${perm.vendor} 専用]`}</h2
                    <div class="overflow-x-auto border rounded">
                        <table class="w-full text-xs text-left text-gray-600">
                            <thead class="bg-gray-100 font-bold border-b">
                                <tr>
                                    <th class="p-2 border">仕入先</th>
                                    <th class="p-2 border">型式 / 品名</th>
                                    <th class="p-2 border">本船名</th>
                                    <th class="p-2 border">ETD</th>
                                    <th class="p-2 border">ETA</th>
                                    <th class="p-2 border">数量</th>
                                    <th class="p-2 border">ステータス</th>
                                </tr>
                            </thead>
                            <tbody>
                                {schedules.length === 0 ? (
                                    <tr><td colSpan="7" class="p-4 text-center text-gray-400">データがありません。</td></tr>
                                ) : (
                                    schedules.map(item => (
                                        <tr key={item.id} class="border-b">
                                            <td class="p-2 border font-bold">{item.vendorCode || '-'}</td>
                                            <td class="p-2 border">{item.modelName || '-'}</td>
                                            <td class="p-2 border">{item.vesselName || '-'}</td>
                                            <td class="p-2 border">{item.etd || '-'}</td>
                                            <td class="p-2 border">{item.eta || '-'}</td>
                                            <td class="p-2 border">{item.quantity || 0}</td>
                                            <td class="p-2 border">{item.status || '-'}</td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function DrayageView() { return <div class="p-4 bg-white rounded shadow">ドレージ管理画面</div>; }
        function PlanView() { return <div class="p-4 bg-white rounded shadow">出荷計画表画面</div>; }
        function AllocationView() { return <div class="p-4 bg-white rounded shadow">コンテナ割振り画面</div>; }
        function OtherView() { return <div class="p-4 bg-white rounded shadow">その他管理画面</div>; }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
