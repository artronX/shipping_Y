        const formatYYMM = (ymStr) => {
            if (!ymStr || !ymStr.includes('-')) return '';
            const parts = ymStr.split('-');
            const yy = parts[0].slice(-2);
            const mm = parts[1].padStart(2, '0');
            return `${yy}${mm}`;
        };

        const parseRefDateToYMD = (ref) => {
            if (!ref) return "";
            if (ref.includes('-') && ref.length >= 7) {
                return ref.length === 7 ? `${ref}-01` : ref;
            }
            if (ref.includes('/')) {
                const parts = ref.split('/');
                if (parts.length === 3) {
                    const yr = parts[0].length === 2 ? `20${parts[0]}` : parts[0];
                    return `${yr}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                }
            }
            const match = ref.match(/(\d+)月/);
            if (match) {
                const mo = match[1].padStart(2, '0');
                const yr = new Date().getFullYear();
                return `${yr}-${mo}-01`;
            }
            return "";

                        allowedViews: matchedRule.allowedViews,

        const App = () => {

            const todayDateStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;

            const getFormattedShortDate = () => {
                const d = new Date();
                const yr = String(d.getFullYear()).slice(-2);
                const mo = String(d.getMonth() + 1).padStart(2, '0');

            const [yoshiiAllocMonth, setYoshiiAllocMonth] = React.useState(currentMonthStr);

            const [dragOverRowId, setDragOverRowId] = React.useState(null);
            const [dragDirection, setDragDirection] = React.useState('bottom');
            const isDraggingOrSortingRef = React.useRef(false);

            const getEffectiveAllowedViews = (userObj) => {
                const targetUser = userObj || authUser;
                if (targetUser && targetUser.allowedViews && targetUser.allowedViews.length > 0) {
                    return targetUser.allowedViews;
                }
                return ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'];
            };

            const effectiveViews = getEffectiveAllowedViews();

            const recordLogoutSession = async () => {
                if (!currentSessionIdRef.current || !loginTimestampRef.current) return;
                const now = new Date();
                const nowStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                const durationMinutes = Math.max(1, Math.round((now.getTime() - loginTimestampRef.current.getTime()) / (1000 * 60)));
                
                try {
                    await db.collection('user_sessions').doc(currentSessionIdRef.current).update({
                        logoutTimeStr: nowStr,
                        logoutTimestamp: now.toISOString(),
                        durationMinutes: durationMinutes
                    });
                } catch (e) { console.error("Session update error:", e); }
                currentSessionIdRef.current = null;
                loginTimestampRef.current = null;
            };

            const handleLoginSuccess = async (user) => {
                if (user && user.name) {
                    localStorage.setItem(LAST_OPERATOR_STORAGE_KEY, user.name);
                }
                localStorage.setItem(LAST_ACTIVE_TIME_KEY, new Date().toISOString());
                setAuthUser(user);
                setOperatorName(user.name);
                setIsLoggedIn(true);
                const initialVendor = user.vendorRestriction || 'ALL';
                setSelectedVendorFilter(initialVendor);
                const initViews = getEffectiveAllowedViews(user);
                if (user.vendorRestriction && initViews.includes('yoshii_ship')) {
                    setCurrentView('yoshii_ship');
                } else if (initViews.length > 0) {
                    setCurrentView(initViews[0]);
                }

                const now = new Date();
                const loginStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                loginTimestampRef.current = now;

                const ua = navigator.userAgent || '';
                let os = 'Unknown OS';
                if (ua.includes('Win')) os = 'Windows';
                else if (ua.includes('Mac')) os = 'Mac';
                else if (ua.includes('Linux')) os = 'Linux';

                let browser = 'Unknown Browser';
                if (ua.includes('Edg')) browser = 'Edge';
                else if (ua.includes('Chrome')) browser = 'Chrome';
                else if (ua.includes('Safari')) browser = 'Safari';

                const deviceInfo = `${os} / ${browser}`;
                let ipAddress = '取得中...';
                let ipLocation = '不明';

                try {
                    const res = await fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => null);
                    if (res && res.ip) {
                        ipAddress = res.ip;
                        const city = res.city || '';
                        const country = res.country_name || res.country || '';
                        ipLocation = [city, country].filter(Boolean).join(', ') || '不明';
                    }
                } catch (e) {}

                try {
                    const docRef = await db.collection('user_sessions').add({
                        operator: user.name,
                        roleLabel: user.label,
                        appVersion: SYSTEM_VERSION,
                        loginTimeStr: loginStr,
                        ipAddress: ipAddress,
                        ipLocation: ipLocation,
                        deviceInfo: deviceInfo,
                        createdAt: now.toISOString()
                    });
                    currentSessionIdRef.current = docRef.id;
                } catch (e) { console.error("Session log error:", e); }
            };

            const handleLogout = async () => {
                await recordLogoutSession();
                setAuthUser(null);
                setIsLoggedIn(false);
            };

            const triggerAutoLogout = async (reasonText) => {
                if (!isLoggedIn) return;
                await recordLogoutSessionWithReason(reasonText);
                setAuthUser(null);
                setIsLoggedIn(false);
            };

            const recordLogoutSessionWithReason = async (reasonText) => {
                if (!currentSessionIdRef.current || !loginTimestampRef.current) return;
                const lastActiveIso = localStorage.getItem(LAST_ACTIVE_TIME_KEY);
                const now = new Date();
                
                const logoutDate = lastActiveIso ? new Date(lastActiveIso) : now;
                const nowStr = `${logoutDate.getFullYear()}/${String(logoutDate.getMonth()+1).padStart(2,'0')}/${String(logoutDate.getDate()).padStart(2,'0')} ${String(logoutDate.getHours()).padStart(2,'0')}:${String(logoutDate.getMinutes()).padStart(2,'0')}:${String(logoutDate.getSeconds()).padStart(2,'0')}`;
                const durationMinutes = Math.max(1, Math.round((logoutDate.getTime() - loginTimestampRef.current.getTime()) / (1000 * 60)));
                
                try {
                    await db.collection('user_sessions').doc(currentSessionIdRef.current).update({
                        logoutTimeStr: `${nowStr} (${reasonText || '切断'})`,
                        logoutTimestamp: logoutDate.toISOString(),
                        durationMinutes: durationMinutes
                    });
                } catch (e) { console.error("Session update error:", e); }
                currentSessionIdRef.current = null;
                loginTimestampRef.current = null;
            };

            React.useEffect(() => {
                if (!isLoggedIn) return;
                const updateActivity = () => {
                    localStorage.setItem(LAST_ACTIVE_TIME_KEY, new Date().toISOString());
                };

                const events = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'];
                events.forEach(evt => window.addEventListener(evt, updateActivity));

                const checkInterval = setInterval(() => {
                    const now = new Date();
                    if (now.getHours() === 23 && now.getMinutes() === 59) {
                        triggerAutoLogout('23:59強制切断');
                        return;
                    }
                    const lastActiveIso = localStorage.getItem(LAST_ACTIVE_TIME_KEY);
                    if (lastActiveIso) {
                        const lastActive = new Date(lastActiveIso);
                        const diffMin = (now.getTime() - lastActive.getTime()) / (1000 * 60);
                        if (diffMin >= AUTO_LOGOUT_MINUTES) {
                            triggerAutoLogout(`⚠️ ${AUTO_LOGOUT_MINUTES}分無操作切断`);
                        }
                    }
                }, 10000);

                return () => {
                    events.forEach(evt => window.removeEventListener(evt, updateActivity));
                    clearInterval(checkInterval);
                };
            }, [isLoggedIn]);

            const logOperation = async (sheetName, action, detail) => {
                const now = new Date();
                const timestampStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                try {
                    await db.collection('operation_logs').add({
                        timestamp: timestampStr,
                        createdAt: now.toISOString(),
                        operator: operatorName || '未設定',
                        appVersion: SYSTEM_VERSION,
                        sheetName, action, detail
                    });
                } catch (e) { console.error("Log Error:", e); }
            };

            const handleOpenLogs = () => {
                const password = prompt("管理者パスワードを入力してください:");
                if (password === '0617') setIsLogModalOpen(true);
                else if (password !== null) alert("パスワードが正しくありません。");
            };

            const handleStartTracking = () => {
                setIsChangeTrackingMode(true);
                alert("変更記録モードを開始しました。");
            };

            const handleClearTracking = async () => {
                setIsChangeTrackingMode(false); 
                logOperation('出荷管理', '修正', '赤文字ハイライトの確定（黒文字化）');
                alert("変更箇所を確定（黒文字化）しました。");
            };

            React.useEffect(() => {
                let unsubMaster = () => {}; let unsubPlans = () => {}; let unsubContainers = () => {}; let unsubLogs = () => {}; let unsubSessions = () => {};

                auth.signInAnonymously().then(() => {
                    unsubMaster = db.collection('shipping_settings').doc('master_data_v5').onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data() || {};
                            const merged = { ...INITIAL_MASTER_DATA, ...data };
                            merged.common = { ...(merged.common || {}), containerSizes: ["20GP", "40GP", "40HQ"] };
                            setMasterData(merged);
                        } else {
                            db.collection('shipping_settings').doc('master_data_v5').set(INITIAL_MASTER_DATA);
                        }
                    });
                    unsubPlans = db.collection('shipments').orderBy('createdAt').onSnapshot(snapshot => {
                        if (!isDraggingOrSortingRef.current) setPlans(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubContainers = db.collection('containers').orderBy('createdAt').onSnapshot(snapshot => {
                        if (!isDraggingOrSortingRef.current) {
                            const rawDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            const convertedDocs = rawDocs.map(c => {
                                let sz = c.containerSize;
                                if (sz === '40FT') sz = '40GP';
                                else if (sz === '20FT') sz = '20GP';
                                return { ...c, containerSize: sz };
                            });
                            setContainers(convertedDocs);
                        }
                        setAppReady(true);
                    });
                    unsubLogs = db.collection('operation_logs').orderBy('createdAt', 'desc').limit(300).onSnapshot(snapshot => {
                        setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubSessions = db.collection('user_sessions').orderBy('createdAt', 'desc').limit(200).onSnapshot(snapshot => {
                        setSessions(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                }).catch(error => { console.error("Auth Error:", error); alert("認証エラー"); });

                return () => { unsubMaster(); unsubPlans(); unsubContainers(); unsubLogs(); unsubSessions(); };
            }, []);

            const getSheetLabel = (company, view) => {
                const prefix = '吉井電気';
                if (view.includes('plan')) return `${prefix} 納品・出荷計画`;
                if (view.includes('alloc')) return `${prefix} コンテナ割振り`;
                if (view.includes('ship')) return `${prefix} 出荷日程表`;
                if (view.includes('drayage')) return `${prefix} ドレージ手配`;
                return `${prefix} 出荷管理`;
            };

            const updatePlan = async (id, data, fieldName = '') => {
                if (authUser && !authUser.canEdit) return;
                try {
                    const sheet = '吉井電気 納品・出荷計画';
                    if (id) {
                        await db.collection('shipments').doc(id).update({ ...data, updatedAt: new Date().toISOString() });
                        logOperation(sheet, '修正', fieldName ? `項目 [${fieldName}] を更新` : '計画情報を更新');
                    } else {
                        await db.collection('shipments').add({ ...data, createdAt: new Date().toISOString() });
                        logOperation(sheet, '追加', '新規計画行を追加');
                    }
                } catch (e) { console.error(e); }
            };

            const updateContainer = async (id, data, month, company, fieldName = '') => {
                if (authUser && !authUser.canEdit) return;
                try {
                    const sheet = getSheetLabel(company || 'yoshii', currentView);
                    const targetMonth = month || yoshiiAllocMonth || currentMonthStr;
                    
                    let payload = { ...data, company: 'yoshii', deliveryMonth: targetMonth, updatedAt: new Date().toISOString() };
                    if (id) {
                        await db.collection('containers').doc(id).update(payload);
                        logOperation(sheet, '修正', fieldName ? `項目 [${fieldName}] を更新` : 'コンテナ情報を更新');
                    } else {
                        await db.collection('containers').add({ ...payload, createdAt: new Date().toISOString() });
                        logOperation(sheet, '追加', '新規コンテナ行を追加');
                    }
                } catch (e) { console.error(e); }
            };

            const deleteContainer = async (id, sheetName = 'コンテナ割振り') => {
                if (authUser && !authUser.canEdit) return;
                if (!id) return;
                await db.collection('containers').doc(id).delete().then(() => {
                    logOperation(sheetName, '削除', 'コンテナ行を削除');
                }).catch(e => console.error(e));
            };

            const updateModelDetail = async (company, model, field, value) => {
                if (authUser && !authUser.canEdit) return;
                const currentCompanyMaster = masterData[company] || {};
                const currentDetails = currentCompanyMaster.modelDetails || {};
                const modelObj = currentDetails[model] || {};
                
                const updatedDetails = {
                    ...currentDetails,
                    [model]: {
                        ...modelObj,
                        [field]: value
                    }
                };
                const newMaster = {
                    ...masterData,
                    [company]: {
                        ...currentCompanyMaster,
                        modelDetails: updatedDetails
                    }
                };
                await db.collection('shipping_settings').doc('master_data_v5').set(newMaster, { merge: true });
                logOperation(getSheetLabel(company, currentView), '修正', `型式 [${model}] の ${field} を更新`);
            };

            const addMasterItem = async (company, listKey, itemValue) => {
                if (authUser && !authUser.canEdit) return;
                const currentCompanyMaster = masterData[company] || {};
                const currentList = currentCompanyMaster[listKey] || [];
                if (!currentList.includes(itemValue)) {
                    const newMaster = {
                        ...masterData,
                        [company]: {
                            ...currentCompanyMaster,
                            [listKey]: [...currentList, itemValue]
                        }
                    };
                    await db.collection('shipping_settings').doc('master_data_v5').set(newMaster, { merge: true });
                }
            };

            const createGridNav = (prefix, maxRow, maxCol) => (e) => {
                const target = e.target; const gridId = target.getAttribute('data-grid-id'); if (!gridId) return;
                const parts = gridId.split('-'); const row = parseInt(parts[parts.length - 2]); const col = parseInt(parts[parts.length - 1]);
                if (e.key === 'Enter') {
                    e.preventDefault(); let nextRow = row; let nextCol = col + 1;
                    if (nextCol > maxCol) { nextCol = 0; nextRow = Math.min(row + 1, maxRow); }
                    setTimeout(() => { const nextEl = document.querySelector(`[data-grid-id="${prefix}-${nextRow}-${nextCol}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); } }, 10);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault(); const nextEl = document.querySelector(`[data-grid-id="${prefix}-${Math.min(row + 1, maxRow)}-${col}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault(); const nextEl = document.querySelector(`[data-grid-id="${prefix}-${Math.max(row - 1, 0)}-${col}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); }
                } else if (e.key === 'ArrowLeft') {
                    if (col > 0) { const nextEl = document.querySelector(`[data-grid-id="${prefix}-${row}-${col - 1}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); } }
                } else if (e.key === 'ArrowRight') {
                    if (col < maxCol) { const nextEl = document.querySelector(`[data-grid-id="${prefix}-${row}-${col + 1}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); } }
                }
            };

            const isAdmin = authUser && (authUser.role === 'ADMIN_ALL' || authUser.role === 'READ_ONLY');

            const handleSelectChange = (id, field, isContainer = true, company = 'yoshii', autoLog = true, fieldLabel = '') => async (newVal, category, origPassed) => {
                if (authUser && !authUser.canEdit) return;
                
                if (newVal === '__ADD_NEW__') {
                    const newItem = prompt(`新しい【${fieldLabel || category}】を入力してください:`);
                    if (newItem && newItem.trim()) {
                        await addMasterItem(company, category, newItem.trim());
                        newVal = newItem.trim();
                    } else return;
                }

                if (isContainer) {
                    const targetContainer = containers.find(c => c.id === id);
                    if (!targetContainer) return;
                    await updateContainer(id, { [field]: newVal }, targetContainer.deliveryMonth, company, fieldLabel || field);
                }
            };

            const handleDragStart = (e, containerId) => {
                setDraggedRowId(containerId);
                isDraggingOrSortingRef.current = true;
                e.dataTransfer.setData('text/plain', containerId);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                if (draggedRowId && draggedRowId !== targetId) {
                    setDragOverRowId(targetId);
                }
            };

            const handleDragEnd = () => {
                setDraggedRowId(null);
                setDragOverRowId(null);
                isDraggingOrSortingRef.current = false;
            };

            const handleDrop = async (e, targetId, containerList) => {
                e.preventDefault();
                if (!draggedRowId || draggedRowId === targetId) {
                    handleDragEnd();
                    return;
                }

                const currentList = [...containerList];
                const fromIdx = currentList.findIndex(c => c.id === draggedRowId);
                const toIdx = currentList.findIndex(c => c.id === targetId);

                if (fromIdx === -1 || toIdx === -1) {
                    handleDragEnd();
                    return;
                }

                const [movedItem] = currentList.splice(fromIdx, 1);
                currentList.splice(toIdx, 0, movedItem);

                const batch = db.batch();
                currentList.forEach((c, idx) => {
                    if (c.id) {
                        const ref = db.collection('containers').doc(c.id);
                        batch.update(ref, {
                            allocNo: idx + 1,
                            sortOrder: idx + 1,
                            updatedAt: new Date().toISOString()
                        });
                    }
                });

                await batch.commit();
                logOperation(getSheetLabel('yoshii', currentView), '並び替え', `コンテナ順序を手動変更 (1〜${currentList.length})`);
                handleDragEnd();
            };

            const contextValue = { 
                masterData, plans, containers, yoshiiAllocMonth, setYoshiiAllocMonth, 
                tableContainerRef, currentMonthStr, todayDateStr, operatorName, 
                getFormattedShortDate, isChangeTrackingMode, handleStartTracking, 
                handleClearTracking, updatePlan, updateContainer, deleteContainer, 
                updateModelDetail, addMasterItem, handleSelectChange,
                createGridNav, logOperation, authUser: authUser ? {
                    ...authUser,
                    canEdit: authUser.canEdit && (!authUser.editableViews || authUser.editableViews.length === 0 || authUser.editableViews.includes(currentView))
                } : null, selectedVendorFilter, setSelectedVendorFilter, shipScrollPosRef, drayScrollPosRef, handleDragStart, handleDragOver, handleDragEnd, handleDrop, draggedRowId, dragOverRowId, dragDirection 
            };

            if (!appReady) return <div className="flex h-screen items-center justify-center font-bold">データ同期中...</div>;
            if (!isLoggedIn) return <LoginModal onLogin={handleLoginSuccess} />;

            return (
                <AppContext.Provider value={contextValue}>
                    <div className="min-h-screen flex flex-col font-sans h-screen overflow-hidden relative">
                        <header className="h-[44px] bg-indigo-700 text-white flex items-center justify-between px-4 shadow no-print flex-shrink-0">
                            <div className="flex items-center gap-4">
                                <a href="shipping.html" className="hover:bg-indigo-600 px-2 py-1 border rounded text-sm transition">ホーム</a>
                                <h1 className="text-lg font-bold hidden md:block">吉井電気<span className="text-sm font-bold bg-indigo-900/80 px-2 py-0.5 rounded text-amber-300 font-mono text-xs ml-2">{SYSTEM_VERSION}</span></h1>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <div className="flex bg-indigo-900 rounded overflow-hidden shadow-inner flex-shrink-0">
                                    {effectiveViews.includes('yoshii_plan') && (
                                        <button onClick={() => setCurrentView('yoshii_plan')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_plan' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>計画</button>
                                    )}
                                    {effectiveViews.includes('yoshii_alloc') && (
                                        <button onClick={() => setCurrentView('yoshii_alloc')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_alloc' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>割振り</button>
                                    )}
                                    {effectiveViews.includes('yoshii_ship') && (
                                        <button onClick={() => setCurrentView('yoshii_ship')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_ship' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>出荷日程</button>
                                    )}
                                    {effectiveViews.includes('yoshii_drayage') && (
                                        <button onClick={() => setCurrentView('yoshii_drayage')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_drayage' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>ドレージ</button>
                                    )}
                                </div>

                                <div className="ml-2">
                                    <select 
                                        value={selectedVendorFilter} 
                                        onChange={e => setSelectedVendorFilter(e.target.value)}
                                        disabled={!isAdmin}
                                        className="bg-white text-gray-900 text-xs font-bold border border-gray-300 rounded px-2 py-1 outline-none shadow-sm disabled:bg-gray-100 disabled:text-gray-700 disabled:cursor-not-allowed cursor-pointer"
                                    >
                                        {isAdmin ? (
                                            <>
                                                <option value="ALL">全体 (全表示)</option>
                                                {Array.from(new Set(['JP', 'GM', 'LDS', 'SLT', 'YO', ...(masterData.yoshii?.vendors || [])])).map(v => (
                                                    <option key={v} value={v}>{v}</option>
                                                ))}
                                            </>
                                        ) : (
                                            <option value={authUser.vendorRestriction || 'YO'}>{authUser.vendorRestriction || 'YO'}</option>
                                        )}
                                    </select>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={handleOpenLogs} 
                                    className="p-1 text-indigo-100 hover:text-white text-sm transition flex items-center gap-1 font-bold bg-indigo-800/60 hover:bg-indigo-600 rounded px-2"
                                    title="操作ログ履歴"
                                >
                                    ⚙
                                </button>
                                <div className="flex items-center gap-1 text-xs">
                                    <span className="text-indigo-200 hidden lg:inline">作業者:</span>
                                    <span className="bg-white text-gray-900 border rounded px-2 py-0.5 font-bold">
                                        {authUser ? authUser.name : '未認証'}
                                    </span>
                                </div>
                                <button onClick={handleLogout} className="text-indigo-200 hover:text-white text-xs underline ml-1">ログアウト</button>
                            </div>
                        </header>

                        <main className="flex-grow flex flex-col h-[calc(100vh-44px)] relative z-0">
                            {currentView === 'yoshii_plan' && effectiveViews.includes('yoshii_plan') && <YoshiiPlanView />}
                            {currentView === 'yoshii_alloc' && effectiveViews.includes('yoshii_alloc') && <YoshiiAllocationView />}
                            {currentView === 'yoshii_ship' && effectiveViews.includes('yoshii_ship') && <YoshiiShipView />}
                            {currentView === 'yoshii_drayage' && effectiveViews.includes('yoshii_drayage') && <YoshiiDrayageView />}
                        </main>

                        <LogViewModal isOpen={isLogModalOpen} onClose={() => setIsLogModalOpen(false)} logs={logs} sessions={sessions} />
                    </div>
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
