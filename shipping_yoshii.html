<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉井電気 製品出荷管理システム</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18, ReactDOM, Babel (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ExcelJS (Excel出力用 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <!-- Firebase 8.x (Compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* スクロールバー・テーブル基本スタイル */
        .table-container { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 180px); }
        .cell-input { width: 100%; height: 100%; border: none; background: transparent; outline: none; font-size: 0.75rem; }
        .cell-input:focus { background-color: #e0e7ff; }

        /* 変更点強調表示用 */
        .is-changed-cell { background-color: #fef08a !important; font-weight: bold; }
        .has-original-tooltip { position: relative; }
        .has-original-tooltip:hover::after {
            content: "【変更前】" attr(data-original-val) " (" attr(data-original-meta) ")";
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background-color: #1e293b; color: #ffffff; padding: 4px 8px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; z-index: 999; pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 印刷スタイル定義 */
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; font-size: 10pt; }
            .table-container { max-height: none !important; overflow: visible !important; }
            @page { size: A4 landscape; margin: 8mm; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        // =========================================================
        // 【最重要】システムバージョン定義（★WebVer. 101へ更新）
        // =========================================================
        const APP_VERSION = 'WebVer. 101';

        // AppContext（全体共有ステート）
        const AppContext = React.createContext(null);

        // 本番用 Firebase 接続設定
        const firebaseConfig = window.FIREBASE_CONFIG || {
            apiKey: "AIzaSyD-YOUR-REAL-KEY-HERE", // グローバル設定があれば自動取得
            authDomain: "shipping-management.firebaseapp.com",
            projectId: "shipping-management",
            storageBucket: "shipping-management.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abc123def456"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 共通コード正規化ユーティリティ
        const normalizeModelCode = (m) => m ? String(m).replace(/[\s\-\_]/g, '').toUpperCase() : '';
        const parseRefDateToYMD = (dStr) => dStr && dStr.includes('-') ? dStr : null;
        const formatYYMM = (ym) => ym ? ym.replace('-', '').substring(2) : '';

        // 【権限一覧表に基づく厳格な判定テーブル】
        const AUTH_TABLE = [
            {
                passwords: ['Zall@0617'],
                role: 'ADMIN_ALL',
                label: '東亜全体 (全画面編集)',
                allowedViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'],
                editableViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'],
                canViewLogs: true,
                vendorRestriction: null
            },
            {
                passwords: ['Read＠0617', 'Read@0617'],
                role: 'READ_ONLY',
                label: '東亜閲覧専用',
                allowedViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'],
                editableViews: [],
                canViewLogs: true,
                vendorRestriction: null
            },
            {
                passwords: ['JPZ10345'],
                role: 'VENDOR_JP',
                label: 'JP専用',
                allowedViews: ['yoshii_alloc', 'yoshii_ship'],
                editableViews: ['yoshii_ship'],
                canViewLogs: false,
                vendorRestriction: 'JP'
            },
            {
                passwords: ['GM10345Z'],
                role: 'VENDOR_GM',
                label: 'GM専用',
                allowedViews: ['yoshii_alloc', 'yoshii_ship'],
                editableViews: ['yoshii_ship'],
                canViewLogs: false,
                vendorRestriction: 'GM'
            },
            {
                passwords: ['LDSZ1034'],
                role: 'VENDOR_LDS',
                label: 'LDS専用',
                allowedViews: ['yoshii_alloc', 'yoshii_ship'],
                editableViews: ['yoshii_ship'],
                canViewLogs: false,
                vendorRestriction: 'LDS'
            },
            {
                passwords: ['SLT1034Z'],
                role: 'VENDOR_SLT',
                label: 'SLT専用',
                allowedViews: ['yoshii_alloc', 'yoshii_ship'],
                editableViews: ['yoshii_ship'],
                canViewLogs: false,
                vendorRestriction: 'SLT'
            },
            {
                passwords: ['YosiiZ'],
                role: 'DRAYAGE_YO',
                label: 'YOドレージ専用',
                allowedViews: ['yoshii_drayage'],
                editableViews: ['yoshii_drayage'],
                canViewLogs: false,
                vendorRestriction: 'YO'
            }
        ];

        // メインアプリケーションコンポーネント
        const App = () => {
            const [authUser, setAuthUser] = React.useState(null);
            const [loginPassword, setLoginPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState('');
            const [operatorName, setOperatorName] = React.useState('近間');

            const [currentView, setCurrentView] = React.useState('yoshii_plan');
            const [currentMonthStr, setCurrentMonthStr] = React.useState('2026-10');
            const [yoshiiAllocMonth, setYoshiiAllocMonth] = React.useState('2026-10');
            const [selectedVendorFilter, setSelectedVendorFilter] = React.useState('ALL');

            const [plans, setPlans] = React.useState([]);
            const [containers, setContainers] = React.useState([]);
            const [masterData, setMasterData] = React.useState({
                yoshii: { models: [], modelDetails: {}, modelOrder: {}, ports: ['東京', '神戸'], vendors: ['JP', 'GM', 'LDS', 'SLT', 'YO'], destinations: [] },
                common: { statuses: ['未確定', '手配中', '出港済', '出荷済み', '納品完了'], containerSizes: ['40HQ', '40GP', '20GP'] }
            });

            const [logs, setLogs] = React.useState([]);
            const [sessions, setSessions] = React.useState([]);
            const [isLogModalOpen, setIsLogModalOpen] = React.useState(false);
            const [isChangeTrackingMode, setIsChangeTrackingMode] = React.useState(false);

            const tableContainerRef = React.useRef(null);
            const currentSessionIdRef = React.useRef(null);
            const shipScrollPosRef = React.useRef(null);
            const drayScrollPosRef = React.useRef(null);

            const getFormattedShortDate = () => {
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                return `${yy}/${mm}/${dd}`;
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                const inputPass = loginPassword.trim();

                const matchedAuth = AUTH_TABLE.find(a => a.passwords.includes(inputPass));
                if (!matchedAuth) {
                    setLoginError('パスワードが正しくありません。');
                    return;
                }

                const userObj = {
                    role: matchedAuth.role,
                    label: matchedAuth.label,
                    allowedViews: matchedAuth.allowedViews,
                    editableViews: matchedAuth.editableViews,
                    canViewLogs: matchedAuth.canViewLogs,
                    vendorRestriction: matchedAuth.vendorRestriction,
                    operator: operatorName
                };

                setAuthUser(userObj);
                
                if (matchedAuth.allowedViews && matchedAuth.allowedViews.length > 0) {
                    setCurrentView(matchedAuth.allowedViews[0]);
                }

                if (matchedAuth.vendorRestriction) {
                    setSelectedVendorFilter(matchedAuth.vendorRestriction);
                } else {
                    setSelectedVendorFilter('ALL');
                }

                try {
                    const now = new Date();
                    const docRef = await db.collection('user_sessions').add({
                        operator: operatorName,
                        roleLabel: matchedAuth.label,
                        appVersion: APP_VERSION,
                        loginTimeStr: now.toLocaleString('ja-JP'),
                        createdAt: now.toISOString()
                    });
                    currentSessionIdRef.current = docRef.id;
                } catch (err) {
                    console.error("Session recording error:", err);
                }
            };

            const handleLogout = () => {
                if (currentSessionIdRef.current) {
                    try {
                        db.collection('user_sessions').doc(currentSessionIdRef.current).update({
                            logoutTimeStr: new Date().toLocaleString('ja-JP')
                        });
                    } catch (e) {}
                }
                setAuthUser(null);
                setLoginPassword('');
            };

            React.useEffect(() => {
                if (!authUser) return;

                const unsubPlans = db.collection('shipments').onSnapshot(snapshot => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPlans(list);
                });

                const unsubContainers = db.collection('containers').onSnapshot(snapshot => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setContainers(list);
                });

                const unsubMaster = db.collection('shipping_settings').doc('master_data_v5').onSnapshot(doc => {
                    if (doc.exists) setMasterData(doc.data());
                });

                const unsubLogs = db.collection('operation_logs').orderBy('timestamp', 'desc').limit(100).onSnapshot(snapshot => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLogs(list);
                });

                const unsubSessions = db.collection('user_sessions').orderBy('createdAt', 'desc').limit(50).onSnapshot(snapshot => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSessions(list);
                });

                return () => {
                    unsubPlans(); unsubContainers(); unsubMaster(); unsubLogs(); unsubSessions();
                };
            }, [authUser]);

            const logOperation = async (sheetName, action, detail) => {
                try {
                    await db.collection('operation_logs').add({
                        operator: operatorName,
                        sheetName, action, detail,
                        timestamp: new Date().toLocaleString('ja-JP')
                    });
                } catch (e) { console.error("Log error:", e); }
            };

            const updatePlan = async (docId, updateData, descStr) => {
                if (docId) {
                    await db.collection('shipments').doc(docId).update(updateData);
                } else {
                    await db.collection('shipments').add(updateData);
                }
                logOperation('納品・出荷計画', '更新', descStr);
            };

            const updateContainer = async (docId, updateData, allocMonth, company='yoshii', descStr='') => {
                if (docId) {
                    await db.collection('containers').doc(docId).update(updateData);
                } else {
                    await db.collection('containers').add({
                        company, deliveryMonth: allocMonth, ...updateData, createdAt: new Date().toISOString()
                    });
                }
                logOperation('コンテナ割振り/出荷', '更新', descStr);
            };

            const deleteContainer = async (docId, descStr) => {
                await db.collection('containers').doc(docId).delete();
                logOperation('コンテナデータ', '削除', descStr);
            };

            const updateModelDetail = async (company, model, field, value) => {
                const currentDetails = masterData[company]?.modelDetails || {};
                const modelEntry = currentDetails[model] || {};
                const updatedDetails = {
                    ...currentDetails,
                    [model]: { ...modelEntry, [field]: value }
                };
                const newMaster = {
                    ...masterData,
                    [company]: { ...masterData[company], modelDetails: updatedDetails }
                };
                await db.collection('shipping_settings').doc('master_data_v5').set(newMaster, { merge: true });
                logOperation('型式詳細情報', '更新', `型式 [${model}] の ${field} を変更`);
            };

            const addMasterItem = async (company, categoryKey, newItem) => {
                const currentList = masterData[company]?.[categoryKey] || [];
                if (currentList.includes(newItem)) return;
                const updatedList = [...currentList, newItem];
                const newMaster = {
                    ...masterData,
                    [company]: { ...masterData[company], [categoryKey]: updatedList }
                };
                await db.collection('shipping_settings').doc('master_data_v5').set(newMaster, { merge: true });
                logOperation('マスタ追加', '追加', `カテゴリー [${categoryKey}] に [${newItem}] を追加`);
            };

            const handleSelectChange = (containerId, field, isContainer, company, isCommon, label) => async (val, category, orig) => {
                if (val === '__ADD_NEW__') {
                    const newItem = prompt(`新しい [${label}] を追加してください:`);
                    if (newItem && newItem.trim()) {
                        const targetCat = isCommon ? 'common' : company;
                        const currentList = masterData[targetCat]?.[category] || [];
                        if (!currentList.includes(newItem.trim())) {
                            await addMasterItem(targetCat, category, newItem.trim());
                        }
                        if (isContainer) {
                            await updateContainer(containerId, { [field]: newItem.trim() }, yoshiiAllocMonth, company, label);
                        }
                    }
                } else {
                    if (isContainer) {
                        await updateContainer(containerId, { [field]: val }, yoshiiAllocMonth, company, label);
                    }
                }
            };

            const handleStartTracking = () => {
                setIsChangeTrackingMode(true);
                alert("【変更記録モード開始】\nこれ以降に変更されたセルが黄色で強調表示されます。");
            };

            const handleClearTracking = () => {
                if (window.confirm("ハイライト表示されている変更記録をすべて消去しますか？")) {
                    setIsChangeTrackingMode(false);
                }
            };

            const createGridNav = (prefix, maxRow, maxCol) => (e) => {
                if (!e.target || !e.target.dataset || !e.target.dataset.gridId) return;
                const parts = e.target.dataset.gridId.split('-');
                if (parts.length < 4) return;

                let row = parseInt(parts[2], 10);
                let col = parseInt(parts[3], 10);

                if (e.key === 'ArrowUp') row = Math.max(0, row - 1);
                else if (e.key === 'ArrowDown') row = Math.min(maxRow, row + 1);
                else if (e.key === 'ArrowLeft') col = Math.max(0, col - 1);
                else if (e.key === 'ArrowRight') col = Math.min(maxCol, col + 1);
                else return;

                const targetId = `${prefix}-${row}-${col}`;
                const nextElem = document.querySelector(`[data-grid-id="${targetId}"]`);
                if (nextElem) {
                    nextElem.focus();
                    if (nextElem.select) nextElem.select();
                }
            };

            const canEditCurrentView = authUser && authUser.editableViews && authUser.editableViews.includes(currentView);

            const contextValue = {
                authUser: {
                    ...authUser,
                    canEdit: canEditCurrentView
                },
                operatorName, setOperatorName,
                currentView, setCurrentView,
                currentMonthStr, setCurrentMonthStr,
                yoshiiAllocMonth, setYoshiiAllocMonth,
                selectedVendorFilter, setSelectedVendorFilter,
                plans, containers, masterData,
                tableContainerRef, shipScrollPosRef, drayScrollPosRef,
                isChangeTrackingMode, handleStartTracking, handleClearTracking,
                logOperation, updatePlan, updateContainer, deleteContainer,
                updateModelDetail, addMasterItem, handleSelectChange,
                getFormattedShortDate, createGridNav
            };

            if (!authUser) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
                            <div className="text-center mb-6">
                                <h1 className="text-2xl font-extrabold text-slate-800">吉井電気</h1>
                                <p className="text-xs font-bold text-indigo-600 mt-1">製品出荷管理システム</p>
                                <span className="inline-block mt-2 bg-amber-400 text-slate-900 font-extrabold px-2.5 py-0.5 rounded font-mono text-xs">
                                    {APP_VERSION}
                                </span>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4 text-xs font-bold">
                                <div>
                                    <label className="block text-slate-700 mb-1">作業者名:</label>
                                    <input 
                                        type="text" 
                                        required 
                                        value={operatorName} 
                                        onChange={e => setOperatorName(e.target.value)}
                                        className="w-full border p-2.5 rounded-lg text-sm bg-slate-50 focus:bg-white text-slate-900 border-slate-300"
                                    />
                                </div>
                                <div>
                                    <label className="block text-slate-700 mb-1">アクセスパスワード:</label>
                                    <input 
                                        type="password" 
                                        required 
                                        value={loginPassword} 
                                        onChange={e => setLoginPassword(e.target.value)}
                                        placeholder="パスワードを入力..." 
                                        className="w-full border p-2.5 rounded-lg text-sm bg-slate-50 focus:bg-white text-slate-900 border-slate-300"
                                    />
                                </div>

                                {loginError && (
                                    <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg text-red-600 text-center font-bold">
                                        {loginError}
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full bg-indigo-900 hover:bg-indigo-950 text-white p-3 rounded-lg text-sm font-bold shadow-lg transition"
                                >
                                    ログインして開始
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <AppContext.Provider value={contextValue}>
                    <div className="h-full flex flex-col">
                        <header className="bg-indigo-900 text-white p-3 flex justify-between items-center shadow-md flex-shrink-0 no-print">
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <span className="bg-amber-400 text-slate-900 text-xs font-extrabold px-2 py-0.5 rounded font-mono">
                                        ホーム
                                    </span>
                                    <h1 className="text-base font-extrabold hidden md:block">
                                        吉井電気 
                                        <span className="ml-2 text-xs font-mono font-bold bg-indigo-950 px-2 py-0.5 rounded text-amber-300 border border-indigo-700">
                                            {APP_VERSION}
                                        </span>
                                    </h1>
                                </div>

                                <nav className="flex items-center gap-1 bg-indigo-950 p-1 rounded-lg border border-indigo-800 text-xs font-bold">
                                    {authUser.allowedViews.includes('yoshii_plan') && (
                                        <button 
                                            onClick={() => setCurrentView('yoshii_plan')}
                                            className={`px-3 py-1.5 rounded-md transition ${currentView === 'yoshii_plan' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            計画
                                        </button>
                                    )}
                                    {authUser.allowedViews.includes('yoshii_alloc') && (
                                        <button 
                                            onClick={() => setCurrentView('yoshii_alloc')}
                                            className={`px-3 py-1.5 rounded-md transition ${currentView === 'yoshii_alloc' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            割振り
                                        </button>
                                    )}
                                    {authUser.allowedViews.includes('yoshii_ship') && (
                                        <button 
                                            onClick={() => setCurrentView('yoshii_ship')}
                                            className={`px-3 py-1.5 rounded-md transition ${currentView === 'yoshii_ship' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            出荷日程
                                        </button>
                                    )}
                                    {authUser.allowedViews.includes('yoshii_drayage') && (
                                        <button 
                                            onClick={() => setCurrentView('yoshii_drayage')}
                                            className={`px-3 py-1.5 rounded-md transition ${currentView === 'yoshii_drayage' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            ドレージ
                                        </button>
                                    )}
                                </nav>
                            </div>

                            <div className="flex items-center gap-3 text-xs font-bold">
                                {authUser.canViewLogs && (
                                    <button 
                                        onClick={() => setIsLogModalOpen(true)}
                                        className="text-slate-300 hover:text-amber-300 p-1 text-sm font-bold transition" 
                                        title="システム管理・操作履歴モーダルを開く"
                                    >
                                        ⚙
                                    </button>
                                )}

                                <div className="bg-indigo-950 px-2.5 py-1 rounded border border-indigo-800 text-slate-200">
                                    作業者: <span className="text-white font-extrabold">{operatorName}</span>
                                </div>

                                <button 
                                    onClick={handleLogout}
                                    className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded font-bold shadow transition"
                                >
                                    ログアウト
                                </button>
                            </div>
                        </header>

                        <main className="flex-grow flex flex-col overflow-hidden relative">
                            {currentView === 'yoshii_plan' && <YoshiiPlanView />}
                            {currentView === 'yoshii_alloc' && <YoshiiAllocationView />}
                            {currentView === 'yoshii_ship' && <YoshiiShipView />}
                            {currentView === 'yoshii_drayage' && <YoshiiDrayageView />}
                        </main>

                        <LogViewModal 
                            isOpen={isLogModalOpen} 
                            onClose={() => setIsLogModalOpen(false)} 
                            logs={logs} 
                            sessions={sessions} 
                        />
                    </div>
                </AppContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <!-- モジュールJavaScriptファイルの順次読み込み -->
    <script type="text/babel" src="shipping_logs.js"></script>
    <script type="text/babel" src="shipping_exports.js"></script>
    <script type="text/babel" src="shipping_views.js"></script>
</body>
</html>
