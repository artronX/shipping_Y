        /* 赤三角＆ツールチップ表示用修復スタイル */

            z-index: 30;

            content: "変更前: " attr(data-original-val) " (" attr(data-original-meta) ")";

        .readonly-cell {

<body class="bg-gray-100 text-gray-800">

    <script type="text/babel">
        const AUTO_LOGOUT_MINUTES = 15;
        const LAST_OPERATOR_STORAGE_KEY = 'shipping_last_operator_name';
        const LAST_ACTIVE_TIME_KEY = 'shipping_last_active_time';
        const { useState, useEffect, useRef, createContext, useContext } = React;
        const AppContext = createContext();

        const firebaseConfig = {
            apiKey: "AIzaSyDcnf0S5M0OsbCOR9yO7OC4eMKwrXmTbFc",
            authDomain: "scedulex.firebaseapp.com",
            projectId: "scedulex",
            storageBucket: "scedulex.appspot.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const AUTH_TABLE = [
            { passwords: ['Zall@0617'], role: 'ADMIN_ALL', label: '東亜全体 (全画面編集)', allowedViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'], editableViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'], vendorRestriction: null, canEdit: true },
            { passwords: ['Read＠0617', 'Read@0617'], role: 'READ_ONLY', label: '閲覧専用', allowedViews: ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'], editableViews: [], vendorRestriction: null, canEdit: false },
            { passwords: ['JPZ10345'], role: 'VENDOR_JP', label: 'JP専用 (出荷日程編集/割振り閲覧)', allowedViews: ['yoshii_alloc', 'yoshii_ship'], editableViews: ['yoshii_ship'], vendorRestriction: 'JP', canEdit: true },
            { passwords: ['GM10345Z'], role: 'VENDOR_GM', label: 'GM専用 (出荷日程編集/割振り閲覧)', allowedViews: ['yoshii_alloc', 'yoshii_ship'], editableViews: ['yoshii_ship'], vendorRestriction: 'GM', canEdit: true },
            { passwords: ['LDSZ1034'], role: 'VENDOR_LDS', label: 'LDS専用 (出荷日程編集/割振り閲覧)', allowedViews: ['yoshii_alloc', 'yoshii_ship'], editableViews: ['yoshii_ship'], vendorRestriction: 'LDS', canEdit: true },
            { passwords: ['SLT1034Z'], role: 'VENDOR_SLT', label: 'SLT専用 (出荷日程編集/割振り閲覧)', allowedViews: ['yoshii_alloc', 'yoshii_ship'], editableViews: ['yoshii_ship'], vendorRestriction: 'SLT', canEdit: true },
            { passwords: ['YosiiZ'], role: 'DRAYAGE_YO', label: 'ドレージ (YO) 専用', allowedViews: ['yoshii_drayage'], editableViews: ['yoshii_drayage'], vendorRestriction: 'YO', canEdit: true }
        ];

        const normalizeModelCode = (str) => {
            if (!str) return '';
            return String(str).replace(/[‐-―−－–—\-]/g, '').replace(/\s+/g, '').toUpperCase();
        };

        const INITIAL_MASTER_DATA = {
            hitachi: { ports: ["東京", "神戸", "博多", "名古屋"], destinations: ["栃木", "五光物流", "高砂倉庫"], models: ["HFK-CV1B", "HFK-CS5000C", "HFK-VS6000T"], modelDetails: {} },
            yoshii: { ports: ["東京", "神戸", "博多", "名古屋"], destinations: ["吉井電気太田物流センター", "NXNP様 西日本", "東日本GLC 浦安Ⅲ"], models: ["ALC-06SK", "ALC-S14", "KS-LC24C"], productNames: ["ｱﾋﾞﾃﾗｯックス LEDｼｰﾘﾝｸﾞ L6畳", "ｱﾋﾞﾃﾗｯックス LEDｼｰﾘﾝｸﾞ L8畳"], modelDetails: {}, modelOrder: {} },
            common: { statuses: ["未確定", "生産中", "検査待", "出港済", "出荷済み", "納品完了"], containerSizes: ["20GP", "40GP", "40HQ"], orderStatuses: ["計画", "発注確定"], splitTypes: ["全", "分納"] }
        };

        const formatYYMM = (ymStr) => {
            if (!ymStr || !ymStr.includes('-')) return '';
            const parts = ymStr.split('-');
            return `${parts[0].slice(-2)}${parts[1].padStart(2, '0')}`;
        };

        // UIコンポーネント: LocalInput
        const LocalInput = ({ value, onChange, onEnter, onTabOut, onFocusTrigger, type="text", className="", listId, dataGridId, onGridKeyDown, autoFocus, onAutoFocused, refDate, placeholder="", originalValue, originalMeta }) => {
            const ctx = useContext(AppContext);
            const [val, setVal] = useState(value !== undefined && value !== null ? String(value) : '');
            const [focused, setFocused] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => { if (!focused) setVal(value !== undefined && value !== null ? String(value) : ''); }, [value, focused]);

            const handleBlur = () => { 
                setFocused(false); setIsEditing(false);
                const currentStr = value !== undefined && value !== null ? String(value) : '';
                if (val !== currentStr) onChange(val, originalValue !== undefined && originalValue !== null ? originalValue : currentStr); 
            };
            const handleFocus = () => { setFocused(true); setIsEditing(false); if (onFocusTrigger) onFocusTrigger(); };
            const handleChange = (e) => { setVal(e.target.value); setIsEditing(true); };
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    if (onGridKeyDown) { e.preventDefault(); handleBlur(); onGridKeyDown(e); } 
                    else { handleBlur(); e.target.blur(); if (onEnter) onEnter(); }
                    return;
                }
                if (onGridKeyDown) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); handleBlur(); onGridKeyDown(e); return; }
                    if (!isEditing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); handleBlur(); onGridKeyDown(e); return; }
                }
            };

            let displayVal = val;
            let currentType = type;
            let extraClass = '';

            const hasOrig = originalValue !== undefined && originalValue !== null && String(originalValue) !== '';
            const isChanged = hasOrig && String(originalValue) !== String(val);
            const tooltipClass = isChanged ? 'has-original-tooltip' : '';
            const changedClass = (ctx.isChangeTrackingMode && isChanged) ? 'is-changed-cell' : '';
            const metaStr = originalMeta || `${ctx.getFormattedShortDate()} ${ctx.operatorName || '未設定'}`;

            if (type === 'number') {
                extraClass = 'text-right ';
                if (!focused && val !== '') {
                    const num = Number(val);
                    if (!isNaN(num)) { displayVal = num.toLocaleString(); currentType = 'text'; }
                }
            } else if (type === 'qc-date' || type === 'date') {
                let formattedDate = displayVal;
                if (!focused && displayVal) {
                    if (displayVal.includes('-')) {
                        const parts = displayVal.split('-');
                        if (parts.length === 3) formattedDate = `${parts[1]}/${parts[2]}`;
                    }
                }
                return (
                    <div className={`relative flex items-center justify-between w-full h-full group bg-transparent text-center min-w-[68px] ${changedClass} ${tooltipClass}`} data-original-val={originalValue === "" ? "【消去】" : originalValue} data-original-meta={metaStr}>
                        <input ref={inputRef} type="text" value={formattedDate} onChange={handleChange} onFocus={handleFocus} onBlur={handleBlur} onKeyDown={handleKeyDown} disabled={ctx.authUser && !ctx.authUser.canEdit} className={`cell-input text-center pr-5 ${className} ${changedClass}`} data-grid-id={dataGridId} placeholder={placeholder}/>
                        <div className="absolute right-0.5 w-4 h-full flex items-center justify-center flex-shrink-0 no-print opacity-40 group-hover:opacity-100 transition-all cursor-pointer">
                            <span className="text-[9px]">📅</span>
                            <input type="date" value={val.includes('-') ? val : ""} disabled={ctx.authUser && !ctx.authUser.canEdit} onChange={e => { setVal(e.target.value); onChange(e.target.value, val); }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                        </div>
                    </div>
                );
            }

            return (
                <div className={`w-full h-full ${tooltipClass}`} data-original-val={originalValue === "" ? "【消去】" : originalValue} data-original-meta={metaStr}>
                    <input ref={inputRef} type={currentType} list={listId} value={displayVal} onChange={handleChange} onFocus={handleFocus} onBlur={handleBlur} onKeyDown={handleKeyDown} disabled={ctx.authUser && !ctx.authUser.canEdit} className={className.includes('matrix-input') ? `${className} ${extraClass} ${changedClass}` : `cell-input ${extraClass} ${className} ${changedClass}`} data-grid-id={dataGridId} placeholder={placeholder}/>
                </div>
            );
        };

        // UIコンポーネント: LocalTextArea
        const LocalTextArea = ({ value, onChange, isCompact=false, className="", originalValue, originalMeta }) => {
            const ctx = useContext(AppContext);
            const [val, setVal] = useState(value !== undefined && value !== null ? String(value) : '');
            const [focused, setFocused] = useState(false);

            useEffect(() => { if (!focused) setVal(value !== undefined && value !== null ? String(value) : ''); }, [value, focused]);

            const handleBlur = () => { setFocused(false); if (val !== (value || '')) onChange(val, value); };

            const hasOrig = originalValue !== undefined && originalValue !== null && String(originalValue) !== '';
            const isChanged = hasOrig && String(originalValue) !== String(val);
            const tooltipClass = isChanged ? 'has-original-tooltip' : '';
            const changedClass = (ctx.isChangeTrackingMode && isChanged) ? 'is-changed-cell' : '';
            const metaStr = originalMeta || `${ctx.getFormattedShortDate()} ${ctx.operatorName || '未設定'}`;

            return (
                <div className={`w-full h-full ${tooltipClass}`} data-original-val={originalValue === "" ? "【消去】" : originalValue} data-original-meta={metaStr}>
                    <textarea value={val} onChange={e => setVal(e.target.value)} onFocus={() => setFocused(true)} onBlur={handleBlur} rows={isCompact ? 1 : 2} disabled={ctx.authUser && !ctx.authUser.canEdit} className={`w-full text-xs px-1 border-none bg-transparent outline-none whitespace-normal break-all resize-y focus:bg-indigo-50 ${isCompact ? 'h-[22px] min-h-[22px] leading-[20px] py-0 overflow-hidden' : 'py-1 min-h-[36px]'} ${className} ${changedClass}`}/>
                </div>
            );
        };

        // UIコンポーネント: DynamicSelect
        const DynamicSelect = ({ value, onChange, category, options, className="", dataGridId, onGridKeyDown, onFocusTrigger, autoDefaultValue, autoFocus, onAutoFocused, originalValue, originalMeta }) => {
            const ctx = useContext(AppContext);
            const [val, setVal] = useState(value || '');
            const selectRef = useRef(null);

            useEffect(() => { setVal(value || ''); }, [value]);

            const handleChange = (e) => {
                const newVal = e.target.value;
                const currentVal = value !== undefined && value !== null ? String(value) : '';
                const origToPass = originalValue !== undefined && originalValue !== null ? originalValue : currentVal;
                if (newVal === '__ADD_NEW__') onChange('__ADD_NEW__', category, origToPass);
                else { setVal(newVal); onChange(newVal, category, origToPass); }
            };

            const hasOrig = originalValue !== undefined && originalValue !== null && String(originalValue) !== '';
            const isChanged = hasOrig && String(originalValue) !== String(val);
            const tooltipClass = isChanged ? 'has-original-tooltip' : '';
            const changedClass = (ctx.isChangeTrackingMode && isChanged) ? 'is-changed-cell' : '';
            const metaStr = originalMeta || `${ctx.getFormattedShortDate()} ${ctx.operatorName || '未設定'}`;

            return (
                <div className={`w-full h-full ${tooltipClass}`} data-original-val={originalValue === "" ? "【消去】" : originalValue} data-original-meta={metaStr}>
                    <select ref={selectRef} value={val} onChange={handleChange} disabled={ctx.authUser && !ctx.authUser.canEdit} className={`cell-input text-center ${className} px-0 ${changedClass}`}>
                        <option value=""></option>
                        {(options || []).map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                        <option value="__ADD_NEW__" className="font-bold text-blue-600">+ 新規追加</option>
                    </select>
                </div>
            );
        };

        // UIコンポーネント: ScheduleFilterSortControl
        const ScheduleFilterSortControl = ({ filterMode, setFilterMode, selectedYear, setSelectedYear, singleMonth, setSingleMonth, startMonth, setStartMonth, endMonth, setEndMonth, sortConfig, setSortConfig }) => (
            <div className="flex flex-wrap items-center justify-between gap-3 bg-gray-50 p-2 rounded border text-xs no-print mb-2 flex-shrink-0">
                <div className="flex items-center gap-3 flex-wrap">
                    <span className="font-bold text-gray-700">📅 納入月表示切替:</span>
                    <select value={filterMode} onChange={e => setFilterMode(e.target.value)} className="border p-1 rounded font-bold bg-white text-indigo-900">
                        <option value="all">全体 (当月スクロール)</option>
                        <option value="current">当月のみ</option>
                        <option value="year">年度指定</option>
                        <option value="month">月指定</option>
                        <option value="range">範囲指定</option>
                    </select>
                    {filterMode === 'year' && (
                        <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-1 rounded font-bold bg-white text-indigo-900">
                            <option value={2025}>2025年度</option>
                            <option value={2026}>2026年度</option>
                            <option value={2027}>2027年度</option>
                        </select>
                    )}
                    {filterMode === 'month' && <input type="month" value={singleMonth} onChange={e => setSingleMonth(e.target.value)} className="border p-1 rounded font-bold bg-white" />}
                    {filterMode === 'range' && (
                        <div className="flex items-center gap-1 font-bold">
                            <input type="month" value={startMonth} onChange={e => setStartMonth(e.target.value)} className="border p-1 rounded bg-white" />
                            <span>〜</span>
                            <input type="month" value={endMonth} onChange={e => setEndMonth(e.target.value)} className="border p-1 rounded bg-white" />
                        </div>
                    )}
                </div>
                <div className="flex items-center gap-2">
                    {sortConfig.length > 0 ? (
                        <div className="flex items-center gap-1 text-[11px] bg-indigo-50 border border-indigo-200 px-2 py-1 rounded text-indigo-800 font-bold">
                            <span>ソート:</span>
                            {sortConfig.map((s, idx) => (
                                <span key={s.key} className="bg-white border px-1.5 py-0.5 rounded shadow-sm">{idx + 1}. {s.label}{s.direction === 'asc' ? '▲' : '▼'}</span>
                            ))}
                            <button onClick={() => setSortConfig([])} className="ml-1 text-red-500 hover:text-red-700 font-bold">✕</button>
                        </div>
                    ) : <span className="text-gray-400 text-[11px]">※[Shift+ヘッダークリック]で複数条件ソート</span>}
                </div>
            </div>
        );

        // UIコンポーネント: LogViewModal
        const LogViewModal = ({ isOpen, onClose, logs, sessions }) => {
            const [activeTab, setActiveTab] = useState('data_logs');
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-6xl h-[85vh] flex flex-col border border-slate-300 overflow-hidden">
                        <div className="p-4 bg-indigo-900 text-white flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <h3 className="font-bold text-base flex items-center gap-2">⚙ システム管理ログ・接続履歴</h3>
                                <span className="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded font-mono">WebVer. 110</span>
                            </div>
                            <button onClick={onClose} className="text-2xl font-bold hover:text-gray-300 leading-none">×</button>
                        </div>
                        <div className="flex bg-slate-100 border-b px-4 pt-2 gap-2 text-xs font-bold">
                            <button onClick={() => setActiveTab('data_logs')} className={`px-4 py-2 rounded-t-lg transition flex items-center gap-1.5 ${activeTab === 'data_logs' ? 'bg-white border-t-2 border-indigo-600 text-indigo-900 shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>📝 データ操作履歴 ({logs.length})</button>
                            <button onClick={() => setActiveTab('access_logs')} className={`px-4 py-2 rounded-t-lg transition flex items-center gap-1.5 ${activeTab === 'access_logs' ? 'bg-white border-t-2 border-indigo-600 text-indigo-900 shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>🔑 接続履歴 ({(sessions || []).length})</button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-grow bg-white">
                            {activeTab === 'data_logs' ? (
                                <table className="w-full text-xs border-collapse">
                                    <thead className="bg-slate-100 sticky top-0 shadow-sm">
                                        <tr className="border-b text-left text-slate-700">
                                            <th className="p-2 border">日時</th><th className="p-2 border">作業者</th><th className="p-2 border">対象シート</th><th className="p-2 border">操作種別</th><th className="p-2 border">詳細内容</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {logs.map(log => (
                                            <tr key={log.id} className="border-b hover:bg-slate-50">
                                                <td className="p-2 border whitespace-nowrap text-slate-600 font-mono">{log.timestamp}</td>
                                                <td className="p-2 border font-bold text-indigo-950 whitespace-nowrap">{log.operator || '未設定'}</td>
                                                <td className="p-2 border whitespace-nowrap font-bold text-slate-700">{log.sheetName}</td>
                                                <td className="p-2 border whitespace-nowrap"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.action === '追加' ? 'bg-blue-100 text-blue-800' : log.action === '削除' ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'}`}>{log.action}</span></td>
                                                <td className="p-2 border leading-relaxed text-slate-800">{log.detail}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            ) : (
                                <table className="w-full text-xs border-collapse">
                                    <thead className="bg-slate-100 sticky top-0 shadow-sm">
                                        <tr className="border-b text-left text-slate-700 text-[11px]">
                                            <th className="p-1.5 border">作業者名</th><th className="p-1.5 border">権限</th><th className="p-1.5 border">Ver</th><th className="p-1.5 border">IP</th><th className="p-1.5 border">地域</th><th className="p-1.5 border">端末</th><th className="p-1.5 border">ログイン日時</th><th className="p-1.5 border">最終操作</th><th className="p-1.5 border text-center">状況</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sessions.map(s => (
                                            <tr key={s.id} className="border-b hover:bg-slate-50 text-[11px]">
                                                <td className="p-1.5 border font-bold text-indigo-950 whitespace-nowrap">{s.operator || '未設定'}</td>
                                                <td className="p-1.5 border whitespace-nowrap text-slate-600 font-bold">{s.roleLabel || '一般'}</td>
                                                <td className="p-1.5 border whitespace-nowrap font-mono font-bold text-amber-700 bg-amber-50 text-center">{s.appVersion || 'ー'}</td>
                                                <td className="p-1.5 border whitespace-nowrap font-mono text-blue-700 font-bold">{s.ipAddress || '―'}</td>
                                                <td className="p-1.5 border whitespace-nowrap text-slate-700 font-bold">{s.ipLocation || '―'}</td>
                                                <td className="p-1.5 border whitespace-nowrap text-slate-600 font-mono">{s.deviceInfo || '―'}</td>
                                                <td className="p-1.5 border whitespace-nowrap font-mono text-emerald-800 font-bold">{s.loginTimeStr}</td>
                                                <td className="p-1.5 border whitespace-nowrap font-mono text-slate-600">{s.logoutTimeStr || '― (操作中)'}</td>
                                                <td className="p-1.5 border text-center whitespace-nowrap font-mono font-bold">{s.logoutTimeStr ? <span className="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-[10px]">切断</span> : <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] animate-pulse">● 接続中</span>}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                        <div className="p-3 bg-slate-100 border-t flex justify-end"><button onClick={onClose} className="bg-slate-700 text-white px-5 py-1.5 rounded-lg text-xs font-bold">閉じる</button></div>
                    </div>
                </div>
            );
        };

        // UIコンポーネント: ModelEditModal
        const ModelEditModal = ({ isOpen, onClose, company='yoshii' }) => {
            const ctx = useContext(AppContext);
            const [models, setModels] = useState([]);

            useEffect(() => {
                if (isOpen) {
                    const masterModels = ctx.masterData[company]?.models || [];
                    const planModels = ctx.plans.filter(p => p.company === company && p.model).map(p => p.model);
                    const mergedSet = new Set([...masterModels, ...planModels]);
                    setModels(Array.from(mergedSet).sort());
                }
            }, [isOpen, ctx.masterData, ctx.plans, company]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-xl h-[75vh] flex flex-col relative">
                        <div className="p-4 bg-emerald-700 text-white flex justify-between items-center rounded-t-lg">
                            <h3 className="font-bold text-base">✏ 型式マスタの編集</h3>
                            <button onClick={onClose} className="text-xl font-bold">×</button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-grow">
                            <table className="w-full text-xs border-collapse">
                                <thead><tr className="border-b bg-gray-100"><th className="p-2 border text-left">型式名</th></tr></thead>
                                <tbody>
                                    {models.map(m => <tr key={m} className="border-b"><td className="p-2 border font-bold">{m}</td></tr>)}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-3 bg-gray-100 border-t flex justify-end"><button onClick={onClose} className="bg-gray-600 text-white px-4 py-1 rounded text-xs font-bold">閉じる</button></div>
                    </div>
                </div>
            );
        };

        // UIコンポーネント: ExportPrintModal
        const ExportPrintModal = ({ isOpen, onClose, screenName, currentMonthStr, onStartExport, defaultMode = 'year' }) => {
            const [mode, setMode] = useState(defaultMode);
            const [selectedYear, setSelectedYear] = useState(2026);
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4 text-xs">
                        <div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold text-base">⚙ 出力・印刷設定 ({screenName})</h3><button onClick={onClose}>×</button></div>
                        <div className="space-y-2">
                            <label className="block font-bold">対象年度:</label>
                            <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-1 rounded w-full font-bold">
                                <option value={2025}>2025年度</option><option value={2026}>2026年度</option><option value={2027}>2027年度</option>
                            </select>
                        </div>
                        <div className="flex justify-end gap-2 border-t pt-3">
                            <button onClick={onClose} className="px-3 py-1.5 rounded bg-gray-200 font-bold">キャンセル</button>
                            <button onClick={() => { onStartExport({ mode, selectedYear }); onClose(); }} className="px-4 py-1.5 rounded bg-emerald-600 text-white font-bold">出力開始</button>
                        </div>
                    </div>
                </div>
            );
        };

        const exportToExcelSimple = ({ title, headers, rows, filename }) => {
            if (typeof ExcelJS === 'undefined') return alert("ExcelJSライブラリ未読込");
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('出荷管理データ');
            worksheet.addRow([title]); worksheet.addRow([]); worksheet.addRow(headers);
            rows.forEach(r => worksheet.addRow(r));
            workbook.xlsx.writeBuffer().then(buffer => {
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
            });
        };

        // ログインモーダル定義
        const LoginModal = ({ onLogin }) => {
            const [workerId, setWorkerId] = useState(() => localStorage.getItem(LAST_OPERATOR_STORAGE_KEY) || '');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setErrorMsg('');
                const cleanWorkerId = String(workerId).trim();
                const cleanPass = String(password).trim();

                if (!cleanWorkerId) { setErrorMsg('作業者ID/お名前を入力してください。'); return; }

                let matchedRule = AUTH_TABLE.find(rule => rule.passwords.includes(cleanPass));
                if (!matchedRule) {
                    const matchPattern = cleanPass.match(/^(.+)[＠@]\s*8888\$/i);
                    if (matchPattern) {
                        const vendorPrefix = matchPattern[1].trim().toUpperCase();
                        matchedRule = { role: `VENDOR_${vendorPrefix}`, label: `${vendorPrefix}専用 (出荷日程編集/割振り閲覧)`, allowedViews: ['yoshii_alloc', 'yoshii_ship'], editableViews: ['yoshii_ship'], vendorRestriction: vendorPrefix, canEdit: true };
                    }
                }

                if (matchedRule) {
                    onLogin({ name: cleanWorkerId, role: matchedRule.role, label: matchedRule.label, allowedViews: matchedRule.allowedViews, editableViews: matchedRule.editableViews || [], vendorRestriction: matchedRule.vendorRestriction, canEdit: matchedRule.canEdit });
                } else {
                    setErrorMsg('パスワードが一致しません。');
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-sm w-full p-6 space-y-5">
                        <div className="text-center space-y-1">
                            <h2 className="text-lg font-bold text-slate-800">吉井電気 製品出荷管理システム</h2>
                            <p className="text-xs text-indigo-600 font-mono font-bold">権限認証ログイン (WebVer. 110)</p>
                        </div>
                        {errorMsg && <div className="bg-red-50 border border-red-200 text-red-600 text-xs p-2.5 rounded text-center font-bold">{errorMsg}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">作業者ID / お名前</label>
                                <input type="text" className="w-full border rounded px-3 py-1.5 text-xs bg-white font-bold" placeholder="例: クレール" value={workerId} onChange={e => setWorkerId(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">パスワード</label>
                                <input type="password" className="w-full border rounded px-3 py-1.5 text-xs font-mono bg-white" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
                            </div>
                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-xs shadow transition">ログイン認証</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const shipScrollPosRef = useRef(null);
            const drayScrollPosRef = useRef(null);
            const [appReady, setAppReady] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [authUser, setAuthUser] = useState(null);

            const [selectedVendorFilter, setSelectedVendorFilter] = useState('ALL');
            const [currentView, setCurrentView] = useState('yoshii_plan');
            
            const [masterData, setMasterData] = useState(INITIAL_MASTER_DATA);
            const [plans, setPlans] = useState([]);
            const [containers, setContainers] = useState([]);
            const [logs, setLogs] = useState([]);
            const [sessions, setSessions] = useState([]);

            const [operatorName, setOperatorName] = useState('');
            const [isLogModalOpen, setIsLogModalOpen] = useState(false);
            const [isChangeTrackingMode, setIsChangeTrackingMode] = useState(false);

            const todayObj = new Date();
            const currentMonthStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}`; 
            const todayDateStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;

            const getFormattedShortDate = () => {
                const d = new Date();
                return `${String(d.getFullYear()).slice(-2)}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} `;
            };

            const [yoshiiAllocMonth, setYoshiiAllocMonth] = useState(currentMonthStr);
            const tableContainerRef = useRef(null);

            const [draggedRowId, setDraggedRowId] = useState(null);
            const [dragOverRowId, setDragOverRowId] = useState(null);
            const [dragDirection, setDragDirection] = useState('bottom');

            const isDraggingOrSortingRef = useRef(false);

            const getEffectiveAllowedViews = (userObj) => {
                const targetUser = userObj || authUser;
                if (targetUser && targetUser.allowedViews && targetUser.allowedViews.length > 0) return targetUser.allowedViews;
                return ['yoshii_plan', 'yoshii_alloc', 'yoshii_ship', 'yoshii_drayage'];
            };

            const effectiveViews = getEffectiveAllowedViews();

            const handleLoginSuccess = async (user) => {
                if (user && user.name) localStorage.setItem(LAST_OPERATOR_STORAGE_KEY, user.name);
                localStorage.setItem(LAST_ACTIVE_TIME_KEY, new Date().toISOString());
                setAuthUser(user);
                setOperatorName(user.name);
                setIsLoggedIn(true);
                setSelectedVendorFilter(user.vendorRestriction || 'ALL');
                const initViews = getEffectiveAllowedViews(user);
                if (user.vendorRestriction && initViews.includes('yoshii_ship')) setCurrentView('yoshii_ship');
                else if (initViews.length > 0) setCurrentView(initViews[0]);
            };

            const handleLogout = () => { setAuthUser(null); setIsLoggedIn(false); };

            const logOperation = async (sheetName, action, detail) => {
                const now = new Date();
                const timestampStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                try {
                    await db.collection('operation_logs').add({ timestamp: timestampStr, createdAt: now.toISOString(), operator: operatorName || '未設定', appVersion: 'WebVer. 110', sheetName, action, detail });
                } catch (e) { console.error("Log Error:", e); }
            };

            const handleOpenLogs = () => {
                const password = prompt("管理者パスワードを入力してください:");
                if (password === '0617') setIsLogModalOpen(true);
                else if (password !== null) alert("パスワードが正しくありません。");
            };

            const handleStartTracking = () => { setIsChangeTrackingMode(true); alert("変更記録モードを開始しました。"); };
            const handleClearTracking = async () => { 
                setIsChangeTrackingMode(false); 
                logOperation('出荷管理', '修正', '赤文字ハイライトの確定（黒文字化）');
                alert("変更箇所を確定（黒文字化）しました。"); 
            };

            useEffect(() => {
                let unsubMaster = () => {}; let unsubPlans = () => {}; let unsubContainers = () => {}; let unsubLogs = () => {}; let unsubSessions = () => {};

                auth.signInAnonymously().then(() => {
                    unsubMaster = db.collection('shipping_settings').doc('master_data_v5').onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data() || {};
                            const merged = { ...INITIAL_MASTER_DATA, ...data };
                            merged.common = { ...(merged.common || {}), containerSizes: ["20GP", "40GP", "40HQ"] };
                            setMasterData(merged);
                        } else { db.collection('shipping_settings').doc('master_data_v5').set(INITIAL_MASTER_DATA); }
                    });
                    unsubPlans = db.collection('shipments').orderBy('createdAt').onSnapshot(snapshot => {
                        if (!isDraggingOrSortingRef.current) setPlans(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubContainers = db.collection('containers').orderBy('createdAt').onSnapshot(snapshot => {
                        if (!isDraggingOrSortingRef.current) {
                            const rawDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setContainers(rawDocs.map(c => ({ ...c, containerSize: c.containerSize === '40FT' ? '40GP' : c.containerSize === '20FT' ? '20GP' : c.containerSize })));
                        }
                        setAppReady(true);
                    });
                    unsubLogs = db.collection('operation_logs').orderBy('createdAt', 'desc').limit(300).onSnapshot(snapshot => {
                        setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubSessions = db.collection('user_sessions').orderBy('createdAt', 'desc').limit(200).onSnapshot(snapshot => {
                        setSessions(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                }).catch(error => { console.error("Auth Error:", error); alert("認証エラー"); });

                return () => { unsubMaster(); unsubPlans(); unsubContainers(); unsubLogs(); unsubSessions(); };
            }, []);

            const updatePlan = async (id, data, fieldName = '') => {
                if (authUser && !authUser.canEdit) return;
                try {
                    if (id) await db.collection('shipments').doc(id).update({ ...data, updatedAt: new Date().toISOString() });
                    else await db.collection('shipments').add({ ...data, createdAt: new Date().toISOString() });
                } catch (e) { console.error(e); }
            };

            const updateContainer = async (id, data, month, company, fieldName = '') => {
                if (authUser && !authUser.canEdit) return;
                try {
                    let payload = { ...data, company: 'yoshii', deliveryMonth: month || yoshiiAllocMonth || currentMonthStr, updatedAt: new Date().toISOString() };
                    if (id) await db.collection('containers').doc(id).update(payload);
                    else await db.collection('containers').add({ ...payload, createdAt: new Date().toISOString() });
                } catch (e) { console.error(e); }
            };

            const deleteContainer = async (id) => {
                if (authUser && !authUser.canEdit || !id) return;
                await db.collection('containers').doc(id).delete();
            };

            const updateModelDetail = async (company, model, field, value) => {
                if (authUser && !authUser.canEdit) return;
                const currentCompanyMaster = masterData[company] || {};
                const currentDetails = currentCompanyMaster.modelDetails || {};
                const modelObj = currentDetails[model] || {};
                const updatedDetails = { ...currentDetails, [model]: { ...modelObj, [field]: value } };
                await db.collection('shipping_settings').doc('master_data_v5').set({ ...masterData, [company]: { ...currentCompanyMaster, modelDetails: updatedDetails } }, { merge: true });
            };

            const addMasterItem = async (company, listKey, itemValue) => {
                if (authUser && !authUser.canEdit) return;
                const currentCompanyMaster = masterData[company] || {};
                const currentList = currentCompanyMaster[listKey] || [];
                if (!currentList.includes(itemValue)) {
                    await db.collection('shipping_settings').doc('master_data_v5').set({ ...masterData, [company]: { ...currentCompanyMaster, [listKey]: [...currentList, itemValue] } }, { merge: true });
                }
            };

            const createGridNav = (prefix, maxRow, maxCol) => (e) => {
                const target = e.target; const gridId = target.getAttribute('data-grid-id'); if (!gridId) return;
                const parts = gridId.split('-'); const row = parseInt(parts[parts.length - 2]); const col = parseInt(parts[parts.length - 1]);
                if (e.key === 'Enter') {
                    e.preventDefault(); let nextRow = row; let nextCol = col + 1;
                    if (nextCol > maxCol) { nextCol = 0; nextRow = Math.min(row + 1, maxRow); }
                    setTimeout(() => { const nextEl = document.querySelector(`[data-grid-id="${prefix}-${nextRow}-${nextCol}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); } }, 10);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault(); const nextEl = document.querySelector(`[data-grid-id="${prefix}-${Math.min(row + 1, maxRow)}-${col}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault(); const nextEl = document.querySelector(`[data-grid-id="${prefix}-${Math.max(row - 1, 0)}-${col}"]`); if (nextEl) { nextEl.focus(); if(nextEl.select) nextEl.select(); }
                }
            };

            const isAdmin = authUser && (authUser.role === 'ADMIN_ALL' || authUser.role === 'READ_ONLY');

            const handleSelectChange = (id, field, isContainer = true, company = 'yoshii', autoLog = true, fieldLabel = '') => async (newVal, category, origPassed) => {
                if (authUser && !authUser.canEdit) return;
                if (isContainer) await updateContainer(id, { [field]: newVal }, yoshiiAllocMonth, company, fieldLabel || field);
            };

            const handleDragStart = (e, containerId) => { setDraggedRowId(containerId); isDraggingOrSortingRef.current = true; };
            const handleDragOver = (e, targetId) => { e.preventDefault(); if (draggedRowId && draggedRowId !== targetId) setDragOverRowId(targetId); };
            const handleDragEnd = () => { setDraggedRowId(null); setDragOverRowId(null); isDraggingOrSortingRef.current = false; };
            const handleDrop = async (e, targetId, containerList) => { handleDragEnd(); };

            const contextValue = { 
                masterData, plans, containers, yoshiiAllocMonth, setYoshiiAllocMonth, 
                tableContainerRef, currentMonthStr, todayDateStr, operatorName, 
                getFormattedShortDate, isChangeTrackingMode, handleStartTracking, 
                handleClearTracking, updatePlan, updateContainer, deleteContainer, 
                updateModelDetail, addMasterItem, handleSelectChange,
                createGridNav, logOperation, authUser: authUser ? {
                    ...authUser,
                    canEdit: authUser.canEdit && (!authUser.editableViews || authUser.editableViews.length === 0 || authUser.editableViews.includes(currentView))
                } : null, selectedVendorFilter, setSelectedVendorFilter, shipScrollPosRef, drayScrollPosRef, handleDragStart, handleDragOver, handleDragEnd, handleDrop, draggedRowId, dragOverRowId, dragDirection 
            };

            if (!appReady) return <div className="flex h-screen items-center justify-center font-bold text-gray-700">データ同期中...</div>;
            if (!isLoggedIn) return <LoginModal onLogin={handleLoginSuccess} />;

            return (
                <AppContext.Provider value={contextValue}>
                    <div className="min-h-screen flex flex-col font-sans h-screen overflow-hidden relative">
                        <header className="h-[44px] bg-indigo-700 text-white flex items-center justify-between px-4 shadow no-print flex-shrink-0">
                            <div className="flex items-center gap-4 min-w-[220px]">
                                <a href="shipping.html" className="hover:bg-indigo-600 px-2 py-1 border rounded text-sm transition">ホーム</a>
                                <h1 className="text-lg font-bold hidden md:block">吉井電気<span className="text-sm font-bold bg-indigo-900/80 px-2 py-0.5 rounded text-amber-300 font-mono text-xs ml-2">WebVer. 110</span></h1>
                            </div>
                            
                            <div className="flex items-center justify-center gap-3 flex-1">
                                <div className="flex bg-indigo-900 rounded overflow-hidden shadow-inner flex-shrink-0">
                                    {effectiveViews.includes('yoshii_plan') && (
                                        <button onClick={() => setCurrentView('yoshii_plan')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_plan' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>計画</button>
                                    )}
                                    {effectiveViews.includes('yoshii_alloc') && (
                                        <button onClick={() => setCurrentView('yoshii_alloc')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_alloc' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>割振り</button>
                                    )}
                                    {effectiveViews.includes('yoshii_ship') && (
                                        <button onClick={() => setCurrentView('yoshii_ship')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_ship' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>出荷日程</button>
                                    )}
                                    {effectiveViews.includes('yoshii_drayage') && (
                                        <button onClick={() => setCurrentView('yoshii_drayage')} className={`px-2 md:px-4 py-1 text-xs md:text-sm ${currentView === 'yoshii_drayage' ? 'bg-emerald-500 font-bold' : 'hover:bg-indigo-600'}`}>ドレージ</button>
                                    )}
                                </div>

                                <div className="ml-2">
                                    <select 
                                        value={selectedVendorFilter} 
                                        onChange={e => setSelectedVendorFilter(e.target.value)}
                                        disabled={!isAdmin}
                                        className="bg-white text-gray-900 text-xs font-bold border border-gray-300 rounded px-2 py-1 outline-none shadow-sm disabled:bg-gray-100 disabled:text-gray-700 disabled:cursor-not-allowed cursor-pointer"
                                    >
                                        {isAdmin ? (
                                            <>
                                                <option value="ALL">全体 (全表示)</option>
                                                {Array.from(new Set(['JP', 'GM', 'LDS', 'SLT', 'YO', ...(masterData.yoshii?.vendors || [])])).map(v => (
                                                    <option key={v} value={v}>{v}</option>
                                                ))}
                                            </>
                                        ) : (
                                            <option value={authUser.vendorRestriction || 'YO'}>{authUser.vendorRestriction || 'YO'}</option>
                                        )}
                                    </select>
                                </div>
                            </div>

                            <div className="flex items-center justify-end gap-3 min-w-[220px]">
                                <button onClick={handleOpenLogs} className="p-1 text-indigo-100 hover:text-white text-sm transition font-bold bg-indigo-800/60 hover:bg-indigo-600 rounded px-2" title="操作ログ履歴">⚙</button>
                                <div className="flex items-center gap-1 text-xs">
                                    <span className="bg-white text-gray-900 border rounded px-2 py-0.5 font-bold">{authUser ? authUser.name : '未認証'}</span>
                                </div>
                                <button onClick={handleLogout} className="text-indigo-200 hover:text-white text-xs underline ml-1">ログアウト</button>
                            </div>
                        </header>

                        <main className="flex-grow flex flex-col h-[calc(100vh-44px)] relative z-0">
                            {currentView === 'yoshii_plan' && effectiveViews.includes('yoshii_plan') && <YoshiiPlanView />}
                            {currentView === 'yoshii_alloc' && effectiveViews.includes('yoshii_alloc') && <YoshiiAllocationView />}
                            {currentView === 'yoshii_ship' && effectiveViews.includes('yoshii_ship') && <YoshiiShipView />}
                            {currentView === 'yoshii_drayage' && effectiveViews.includes('yoshii_drayage') && <YoshiiDrayageView />}
                        </main>

                        <LogViewModal isOpen={isLogModalOpen} onClose={() => setIsLogModalOpen(false)} logs={logs} sessions={sessions} />
                    </div>
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- 分割コンポーネントおよびビューモジュールの読み込み -->
    <script type="text/babel" src="shipping_views_plan.js"></script>
    <script type="text/babel" src="shipping_views_ship.js"></script>
</body>
</html>
